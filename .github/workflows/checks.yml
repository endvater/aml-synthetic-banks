name: Benchmark checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install 'jsonschema>=4,<5'
      - run: python tools/check_benchmark.py
